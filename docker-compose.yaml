services:

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - PATH TO CONFIG FILE/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  miner-metrics:
    image: java-miner-metrics:0.2
    container_name: java-miner-metrics-0.2
    ports:
      - "9090:9090"
    restart: unless-stopped
    command: ["IPV4"]

volumes:
  prometheus_data: